@if (isLoggedIn) {
  <h2>
    <strong class="text-11">{{name}}</strong>
    <span class="text-12">{{surname}}</span>
  </h2>
}
@else {
  <h1>No data</h1>
}

@if (isLoggedIn) {
  <div class="text-15">
    @for (prof of professions; track prof; let isLast = $last){

      {{ prof }}

      @if (!isLast) {
        & 
      }

    }
  </div>
}
@else {
  <h1>No data</h1>
}
