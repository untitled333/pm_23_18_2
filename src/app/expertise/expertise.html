<div>
  @if (isVisible) {
    <span class="text-1">{{ title }}</span>
  } @else {
    <h1>No data</h1>
  }

  <div class="yellow-line"></div>

  @if (isVisible) {
    @for (skill of skills; track skill) {
      <div class="EXPERTISE">
        <label>{{ skill }}</label>
        <input type="range" min="0" max="100" value="50" class="slider" disabled>
      </div>
    }
  }
</div>
