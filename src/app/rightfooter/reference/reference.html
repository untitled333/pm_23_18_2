@if (isVisible) {

<div>
  <span class="text-5">REFERENCE</span>
  <div class="yellow-line"></div>

  <div class="row">
    @for (ref of references; track ref.name) {
      <div class="col-6">
        <div class="text-6">{{ ref.name }}</div>
        <div class="text-9">{{ ref.position }}</div>
        <div class="text-9">Phone: {{ ref.phone }}</div>
      </div>
    }
  </div>
</div>

} @else {
  <h1>No data</h1>
}
